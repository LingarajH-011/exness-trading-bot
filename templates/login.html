{% extends "base.html" %}
{% block title %}Sign in · Exness Bot{% endblock %}
{% block body %}
<main class="narrow">
  <h1>Sign in</h1>
  <p class="sub">Enter your dashboard password.</p>
  {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ category }}">{{ message }}</div>
  {% endfor %}
  <form class="card stack" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="password" style="margin-top:0">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
    <div class="row"><button class="btn btn-p" type="submit">Sign in</button></div>
  </form>
</main>
{% endblock %}
